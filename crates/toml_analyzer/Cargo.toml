[package]
name = "toml_analyzer"
version = "0.3.0"
description = "Language server for TOML, with JSON Schema support."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "toml_analyzer"
path = "src/main.rs"

[dependencies]
toml_fmt.workspace = true
toml_ide.workspace = true
toml_schema.workspace = true

anyhow.workspace = true
crossbeam-channel.workspace = true
env_logger = "0.11"
globset.workspace = true
log = "0.4"
lsp-server = "0.10.0"
lsp-types = "0.97"
rustc-hash.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
ureq = "3.3.0"
url.workspace = true

[lints]
workspace = true
